name: Build Kubean Imgs

on:
  workflow_call:
    inputs:
      SPRAY_IMG_TAG:
        required: true
        type: string
      REPO:
        required: true
        type: string
      BUILD_IMG_TAG:
        required: true
        type: string

jobs:
  build-imgs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: airgap-patch
          dockerfile: build/images/airgap-patch/Dockerfile
          tags: |
            ghcr.io/${{ inputs.REPO }}/airgap-patch:${{ inputs.BUILD_IMG_TAG }}
            ghcr.io/${{ inputs.REPO }}/airgap-patch:latest
          build-args: |
            SPRAY_TAG=${{ inputs.SPRAY_IMG_TAG }}-modern
            REPO=${{ inputs.REPO }}
        # 设了 outputs 的条目按 digest 推送，tag 由后续步骤读出 ansible-core 版本后统一补齐。
        - name: spray-job
          outputs: type=image,name=ghcr.io/${{ inputs.REPO }}/spray-job,push-by-digest=true,name-canonical=true,push=true
          dockerfile: build/images/spray-job/Dockerfile
          aliases: ${{ inputs.BUILD_IMG_TAG }}-modern latest
          build-args: |
            SPRAY_TAG=${{ inputs.SPRAY_IMG_TAG }}-modern
            REPO=${{ inputs.REPO }}
        - name: spray-job-ansible9
          outputs: type=image,name=ghcr.io/${{ inputs.REPO }}/spray-job,push-by-digest=true,name-canonical=true,push=true
          dockerfile: build/images/spray-job/Dockerfile
          aliases: ${{ inputs.BUILD_IMG_TAG }}
          build-args: |
            SPRAY_TAG=${{ inputs.SPRAY_IMG_TAG }}
            REPO=${{ inputs.REPO }}
        - name: kubean-operator
          dockerfile: build/images/kubean-operator/Dockerfile
          tags: |
            ghcr.io/${{ inputs.REPO }}/kubean-operator:${{ inputs.BUILD_IMG_TAG }}
            ghcr.io/${{ inputs.REPO }}/kubean-operator:latest
          build-args: ""
        - name: kubean-admission
          dockerfile: build/images/kubean-admission/Dockerfile
          tags: |
            ghcr.io/${{ inputs.REPO }}/kubean-admission:${{ inputs.BUILD_IMG_TAG }}
            ghcr.io/${{ inputs.REPO }}/kubean-admission:latest
          build-args: ""

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: ${{ matrix.name }} image build
      id: build
      uses: docker/build-push-action@v7.3.0
      with:
        context: ./
        file: ${{ matrix.dockerfile }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push: ${{ matrix.outputs == '' }}
        provenance: false
        platforms: linux/amd64,linux/arm64
        tags: ${{ matrix.tags }}
        outputs: ${{ matrix.outputs }}
        build-args: ${{ matrix.build-args }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    - name: Publish spray-job Ansible core tags
      id: publish-spray-job-tags
      if: matrix.outputs != ''
      shell: bash
      env:
        IMAGE_REPO: ghcr.io/${{ inputs.REPO }}/spray-job
        IMAGE_VERSION: ${{ inputs.BUILD_IMG_TAG }}
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE_ALIASES: ${{ matrix.aliases }}
      # IMAGE_ALIASES 故意不加引号，按空白拆成多个别名参数。
      run: hack/publish-image-tags.sh "$IMAGE_REPO" "$IMAGE_DIGEST" "$IMAGE_VERSION" $IMAGE_ALIASES
